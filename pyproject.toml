[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-projects"
version = "0.1.0"
description = "Reproducible machine learning implementations and experiments in Python"
license = {text = "MIT AND BSD-3-Clause"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
    "pillow>=10,<14",
]

[project.optional-dependencies]
neural = ["torch>=2.6,<3"]
detection = ["torch>=2.6,<3", "torchvision>=0.21,<1", "scipy>=1.14,<2"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
dev = ["pytest>=8,<10", "nbclient>=0.10,<1", "nbformat>=5.10,<6"]

[tool.setuptools.packages.find]
include = ["linear_regression*", "decision_trees*", "svm_vehicle_classification*", "neural_network_classification*", "object_detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*.txt"]
