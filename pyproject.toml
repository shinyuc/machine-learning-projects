[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-learning-projects"
version = "0.1.0"
description = "Reproducible machine learning implementations and experiments in Python"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
dev = ["pytest>=8,<10", "nbclient>=0.10,<1", "nbformat>=5.10,<6"]

[tool.setuptools.packages.find]
include = ["linear_regression*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
